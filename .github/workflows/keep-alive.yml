name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to prevent spin-down..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://autonomous-ai-knowledge-worker-xcef.onrender.com/)
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Render backend is awake and responding!"
          else
            echo "⚠️ Unexpected status: $STATUS (backend might be waking up)"
          fi
