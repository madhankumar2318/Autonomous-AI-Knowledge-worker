<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="8" />

  <!-- Brain Circuitry Glow -->
  <g filter="url(#glow)" stroke="url(#brainGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Hemisphere -->
    <path d="M 230 140 C 180 140, 130 170, 130 220 C 130 245, 142 268, 160 282 C 145 296, 136 318, 136 342 C 136 386, 172 418, 218 418 C 228 418, 238 416, 246 412" />
    <path d="M 180 230 C 205 230, 226 210, 226 185" />
    <path d="M 150 330 C 180 330, 204 310, 204 280 C 204 255, 225 240, 246 240" />
    <path d="M 180 380 C 205 380, 226 360, 226 335" />

    <!-- Right Hemisphere -->
    <path d="M 282 140 C 332 140, 382 170, 382 220 C 382 245, 370 268, 352 282 C 367 296, 376 318, 376 342 C 376 386, 340 418, 294 418 C 284 418, 274 416, 266 412" />
    <path d="M 332 230 C 307 230, 286 210, 286 185" />
    <path d="M 362 330 C 332 330, 308 310, 308 280 C 308 255, 287 240, 266 240" />
    <path d="M 332 380 C 307 380, 286 360, 286 335" />
  </g>

  <!-- Neural Nodes -->
  <circle cx="230" cy="140" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="282" cy="140" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="130" cy="220" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="382" cy="220" r="10" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="218" cy="418" r="10" fill="#10b981" filter="url(#glow)" />
  <circle cx="294" cy="418" r="10" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="240" r="12" fill="#38bdf8" filter="url(#glow)" />
</svg>